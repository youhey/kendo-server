services:
  kendo-server:
    build: .
    container_name: kendo-server
    restart: unless-stopped
    ports:
      - "${KENDO_HOST_PORT:-9401}:${KENDO_HTTP_PORT:-8080}"
    environment:
      KENDO_ADDR: ":${KENDO_HTTP_PORT:-8080}"
      KENDO_DB_PATH: "${KENDO_DB_PATH:-/data/kendo.sqlite3}"
    volumes:
      - "${KENDO_DATA_DIR:-./data}:/data"
    healthcheck:
      test: ["CMD", "kendo-server", "healthcheck", "http://localhost:${KENDO_HTTP_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
