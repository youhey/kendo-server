services:
  kendo-server:
    build: .
    container_name: kendo-server
    restart: unless-stopped
    ports:
      - "9401:8080"
    environment:
      KENDO_ADDR: ":8080"
      KENDO_DB_PATH: "/data/kendo.sqlite3"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
